# Two services from one image (see Dockerfile):
#
#   dashboard -- always-on Streamlit UI, reachable at http://<nas-ip>:8501.
#                Starts automatically with `docker compose up -d` and
#                restarts on its own if the NAS reboots or the container
#                crashes (restart: unless-stopped).
#
#   pipeline  -- NOT started by `docker compose up`. It carries
#                `profiles: [tools]` specifically so it stays out of the
#                default startup set -- it's meant to be run once per
#                invocation via QNAP Task Scheduler, e.g.:
#                  docker compose run --rm pipeline bash nas/daily_pipeline.sh
#                A container that runs to completion and exits is normal
#                here, not a crash -- don't add restart: to this service.
#
# Both services share the same ./data volume (the SQLite DB + CSVs) so
# whatever the pipeline just wrote is immediately visible to the running
# dashboard without a restart.
#
# ./constituents is ALSO mounted (not baked into the image) even though
# it ships with the repo -- pipeline runs via `docker compose run --rm`,
# which deletes the container after each run. Without this mount, a
# successful refresh_universe run would update constituents/*.csv only
# inside that now-deleted container, silently losing the whole point of
# the fallback cache (see src/ingestion/universe.py's
# CONSTITUENTS_CACHE_DIR comment) on every single run.
version: "3.8"

services:
  dashboard:
    build: .
    image: market-breadth-detector:latest
    container_name: market-breadth-dashboard
    command: >
      streamlit run dashboard/streamlit_app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./constituents:/app/constituents
    environment:
      - BREADTH_DB_PATH=/app/data/breadth.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  pipeline:
    build: .
    image: market-breadth-detector:latest
    container_name: market-breadth-pipeline
    profiles: ["tools"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./constituents:/app/constituents
    environment:
      - BREADTH_DB_PATH=/app/data/breadth.db
    env_file:
      - .env
